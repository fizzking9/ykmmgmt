# Production stack — runs on the local machine.
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d
#
# Image names come from deploy/.env.prod (set by scripts/deploy.ps1), with a
# `build:` fallback so the stack can also run from locally built images
# during development of the deployment itself.
#
# Only the `frontend` port is published to the host; `frpc` carries it to
# the Alibaba Cloud reverse-proxy entry over the tunnel.

# Isolate this stack from the dev docker-compose.yml in the same directory —
# without an explicit project name both files would share the default
# project (directory name) and their `db` services would clobber each other.
name: ykmmgmt-prod

# Rotated JSON logs per container — view with `docker logs <container>`,
# inspect raw files under \\\\wsl$\docker-desktop-data (see README).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    container_name: ykmmgmt-prod-db
    restart: unless-stopped
    logging: *default-logging
    # File-based logs on the host (logs/db/): daily files, truncated on reuse,
    # plus slow-query logging (statements over 500 ms)
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%Y-%m-%d.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=20MB
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./logs/db:/var/log/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ykmmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in deploy/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-ykmmgmt}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ykmmgmt} -d ${POSTGRES_DB:-ykmmgmt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-ykmmgmt-backend:dev}
    build: ./ykmmgmt/backend
    container_name: ykmmgmt-prod-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ykmmgmt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ykmmgmt}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in deploy/.env.prod}
      ROOT_USERNAME: ${ROOT_USERNAME:-}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_FILE: /logs/app.log
    volumes:
      - ./logs/backend:/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-ykmmgmt-frontend:dev}
    build: ./ykmmgmt/frontend
    container_name: ykmmgmt-prod-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - internal

  # MCP server for external AI agents — streamable HTTP on :8001, exposed
  # to the cloud entry through its own frpc tunnel proxy (remote port 7002).
  # The service account is a regular backend user (e.g. an admin created via
  # the user management UI) whose credentials live in deploy/.env.prod.
  mcp_server:
    image: ${MCP_IMAGE:-ykmmgmt-mcp:dev}
    build: ./ykmmgmt/mcp_server
    container_name: ykmmgmt-prod-mcp
    restart: unless-stopped
    logging: *default-logging
    environment:
      YKM_BACKEND_URL: http://backend:8000
      YKM_SERVICE_USERNAME: ${YKM_SERVICE_USERNAME:?YKM_SERVICE_USERNAME is required in deploy/.env.prod}
      YKM_SERVICE_PASSWORD: ${YKM_SERVICE_PASSWORD:?YKM_SERVICE_PASSWORD is required in deploy/.env.prod}
      YKM_MCP_API_KEY: ${YKM_MCP_API_KEY:?YKM_MCP_API_KEY is required in deploy/.env.prod}
      # Base URL baked into the download links export_visualizations returns
      YKM_MCP_PUBLIC_URL: ${YKM_MCP_PUBLIC_URL:-}
      # Exported files await download here (/exports → ./mcp_exports on host)
      YKM_MCP_FILES_DIR: /exports
    volumes:
      # File store for export_visualizations download links — files land in
      # ./mcp_exports on the host and are pruned after the URL TTL expires.
      - ./mcp_exports:/exports
    depends_on:
      - backend
    networks:
      - internal

  frpc:
    image: snowdreamtech/frpc:latest
    container_name: ykmmgmt-prod-frpc
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/frpc.toml:/etc/frp/frpc.toml:ro
      - ./logs/frpc:/logs
    depends_on:
      - frontend
      - mcp_server
    networks:
      - internal

volumes:
  pgdata_prod:

networks:
  internal:

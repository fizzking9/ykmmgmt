# Frontend container: serve the React SPA and proxy API calls to the
# backend service on the internal compose network.
server {
    listen 80;
    server_name _;

    # CSV/Excel uploads — generous limit
    client_max_body_size 50m;

    # API → FastAPI backend container.
    # The upstream is resolved lazily per request (Docker's embedded DNS):
    # a hard-coded proxy_pass hostname would crash Nginx at startup when
    # the backend container is temporarily down or unresolvable.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large imports can take a while to clean + upsert
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA — client-side routing fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

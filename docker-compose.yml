services:
  db:
    image: postgres:16
    container_name: ykmmgmt-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ykmmgmt
      POSTGRES_PASSWORD: ykmmgmt
      POSTGRES_DB: ykmmgmt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ykmmgmt -d ykmmgmt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
